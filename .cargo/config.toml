# 静态链接 OpenCV + ort（Windows MSVC）
# OpenCV 使用 x64-windows-static-md（静态库 + 动态 CRT /MD），
# 与 pyke 预编译的静态 onnxruntime.lib 一致，便于把 ORT 打进单个 exe。
# 先运行: powershell -File scripts/setup_opencv_static.ps1
# （脚本默认安装 x64-windows-static-md）

[env]
# opencv-binding-generator：CLANG_PATH 直指 clang.exe；LIBCLANG_PATH 给 libclang.dll。
# 用 8.3 短路径，避免 "Program Files" 空格导致 cargo [env] PATH 注入失效。
CLANG_PATH = { value = 'C:\PROGRA~1\LLVM\bin\clang.exe', force = true }
LIBCLANG_PATH = { value = 'C:\PROGRA~1\LLVM\bin', force = true }
PATH = { value = 'C:\PROGRA~1\LLVM\bin;{value}', force = true }
# Clang 19+ 解析 MSVC 头需要显式 MS 兼容；否则 vcruntime.h / corecrt 会爆。
OPENCV_CLANG_ARGS = { value = '--target=x86_64-pc-windows-msvc -fms-compatibility -fms-extensions -fdeclspec', force = true }

OPENCV_INCLUDE_PATHS = { value = 'C:\Users\glsa-\vcpkg\installed\x64-windows-static-md\include\opencv4', force = true }
OPENCV_LINK_PATHS = { value = 'C:\Users\glsa-\vcpkg\installed\x64-windows-static-md\lib', force = true }
OPENCV_LINK_LIBS = { value = "opencv_imgcodecs4,opencv_features2d4,opencv_calib3d4,opencv_flann4,opencv_imgproc4,opencv_core4,libpng16,jpeg,tiff,lzma,libwebp,libwebpmux,libwebpdecoder,libwebpdemux,libsharpyuv,zs", force = true }
# 与 static-md / 动态 CRT 对齐；勿再开 +crt-static（会与 ort 静态库冲突）
OPENCV_MSVC_CRT = { value = "dynamic", force = true }
