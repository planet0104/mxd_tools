[package]
edition      = "2024"
name         = "usb-device"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "usb-device"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s2", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s2"] }
critical-section = "1.2.0"
# 依赖包名与本工程 package name 冲突，故重命名。
usb-device-stack = { package = "usb-device", version = "0.3.2" }
usbd-serial = "0.2.2"
usbd-hid = "0.10.1"

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
